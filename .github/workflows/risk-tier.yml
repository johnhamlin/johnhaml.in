name: Risk tier

# On pull_request, GitHub runs this file from the pull request. The label job
# checks out only the base commit and reads changed paths from the files API.
# Pull request files are not downloaded there. Unit tests run in a read-only job.
# A pull request that edits this workflow file can skip the check. CODEOWNERS
# and branch protection are the backstop.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Cloudflare Pages builds this repo with Node 22.16.0.
          node-version: "22.16.0"

      - name: Unit tests
        run: node --test scripts/risk-tier.test.mjs

  risk-tier:
    name: Label risk tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set risk label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f scripts/risk-tier.mjs ] || [ ! -f risk-tiers ]; then
            node --input-type=module <<'END_BOOTSTRAP'
          import fs from 'node:fs';

          console.log('Base commit is missing scripts/risk-tier.mjs or risk-tiers. Fail closed as high.');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pullRequest = event.pull_request;
          const body = typeof pullRequest?.body === 'string' ? pullRequest.body : '';
          const checked = [];
          const re = /^[ \t]*(?:[-*]|\d+[.)])[ \t]+\[([ xX])\][ \t]+(low|medium|high)(?![\w-])/gim;
          for (const match of body.matchAll(re)) {
            if (match[1].toLowerCase() === 'x') checked.push(match[2].toLowerCase());
          }
          const rank = { low: 0, medium: 1, high: 2 };
          let exitCode = 0;
          function finishBody() {
            if (checked.length === 0) {
              console.error('Risk tier check failed: no tier is checked in the PR body');
              exitCode = 1;
              return;
            }
            const claimed = checked.reduce((best, item) => (rank[item] > rank[best] ? item : best));
            if (rank[claimed] < rank.high) {
              console.error(`Risk tier check failed: checked tier ${claimed} is lower than computed tier high`);
              exitCode = 1;
              return;
            }
            console.log(`PR body check passed (checked ${claimed}, computed high).`);
          }

          const repository = process.env.GITHUB_REPOSITORY;
          const api = (process.env.GITHUB_API_URL ?? 'https://api.github.com').replace(/\/$/, '');
          const number = pullRequest.number;

          function nextLink(header) {
            if (!header) return null;
            for (const part of header.split(',')) {
              const match = part.match(/<([^>]+)>;\s*rel="next"/);
              if (match) return match[1];
            }
            return null;
          }

          async function request(method, urlPath, jsonBody, allow) {
            const response = await fetch(urlPath.startsWith('http') ? urlPath : `${api}${urlPath}`, {
              method,
              body: jsonBody === undefined ? undefined : JSON.stringify(jsonBody),
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'User-Agent': 'risk-tier-check',
                'X-GitHub-Api-Version': '2022-11-28',
                ...(jsonBody === undefined ? {} : { 'Content-Type': 'application/json' }),
              },
            });
            const text = response.status === 204 ? '' : await response.text();
            if (response.status === 403) return { status: 403, data: null, next: null };
            const allowed = new Set(allow ?? []);
            if (!response.ok && !allowed.has(response.status)) {
              throw new Error(`GitHub API ${response.status} for ${method} ${urlPath}: ${text.slice(0, 300)}`);
            }
            let data = null;
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = text;
              }
            }
            return { status: response.status, data, next: nextLink(response.headers.get('link')) };
          }

          try {
            const files = [];
            let url = `/repos/${repository}/pulls/${number}/files?per_page=100`;
            while (url) {
              const page = await request('GET', url);
              if (page.status === 403) {
                console.log('Could not list changed files. The tier is still high. GitHub API 403');
                break;
              }
              if (!Array.isArray(page.data)) throw new Error('GitHub pull file list was not an array');
              for (const entry of page.data) {
                if (typeof entry?.filename === 'string' && entry.filename) files.push(entry.filename);
                if (typeof entry?.previous_filename === 'string' && entry.previous_filename) {
                  files.push(entry.previous_filename);
                }
              }
              url = page.next;
            }
            for (const file of [...new Set(files)].sort()) console.log(`high\t${file}`);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            console.log(`Could not list changed files. The tier is still high. ${message.split('\n')[0]}`);
          }
          console.log('Computed risk tier: high');
          console.log('Label: risk:high');

          async function syncLabel() {
            const repo = `/repos/${repository}`;
            const existing = await request('GET', `${repo}/labels/${encodeURIComponent('risk:high')}`, undefined, [404]);
            if (existing.status === 403) return false;
            if (existing.status === 404) {
              const created = await request(
                'POST',
                `${repo}/labels`,
                { name: 'risk:high', color: 'b60205', description: 'Computed risk tier is high' },
                [422],
              );
              if (created.status === 403) return false;
            }
            const listed = await request('GET', `${repo}/issues/${number}/labels?per_page=100`);
            if (listed.status === 403) return false;
            if (!Array.isArray(listed.data)) throw new Error('GitHub label list was not an array');
            const names = listed.data.map((label) => label.name);
            const stale = names.filter((name) => name === 'risk:low' || name === 'risk:medium');
            if (!names.includes('risk:high')) {
              const added = await request('POST', `${repo}/issues/${number}/labels`, { labels: ['risk:high'] });
              if (added.status === 403) return false;
              console.log('Added label: risk:high');
            } else {
              console.log('Added label: (none)');
            }
            for (const name of stale) {
              const removed = await request(
                'DELETE',
                `${repo}/issues/${number}/labels/${encodeURIComponent(name)}`,
                undefined,
                [404],
              );
              if (removed.status === 403) return false;
            }
            console.log(`Removed stale labels: ${stale.join(', ') || '(none)'}`);
            console.log('Risk labels now: risk:high');
            return true;
          }

          try {
            const wrote = await syncLabel();
            if (!wrote) console.warn('Risk label write was denied (403). Continuing with the body check.');
          } catch (error) {
            console.error(error instanceof Error ? error.message : String(error));
            exitCode = 1;
          }
          finishBody();
          process.exitCode = exitCode;
          END_BOOTSTRAP
          else
            node scripts/risk-tier.mjs
          fi
