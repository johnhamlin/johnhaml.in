name: Risk tier

# Runs this file from the pull request. The token cannot run with base-branch privileges.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-tier:
    name: Label risk tier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base and head
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Cloudflare Pages builds this repo with Node 22.16.0.
          node-version: "22.16.0"

      - name: Unit tests
        run: node --test scripts/risk-tier.test.mjs

      - name: Set risk label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/risk-tier.mjs
